<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Life360</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <nav class="nav-inner"><a class="brand" href="index.html"><img src="public/images/life360-logo-dark.svg"
                    alt="Life360 home"></a><a href="index.html">Back to home</a></nav>
    </header>
    <main class="login-page">
        <section class="login-card"><img src="public/images/life360-logo-dark.svg" alt="Life360">
            <h1>Welcome back</h1>
            <p>Log in to your Life360 Circle.</p>
            <form id="login-form"><label for="email">Email address</label><input id="email" type="email" required
                    placeholder="you@example.com"><label for="password">Password</label><input id="password"
                    type="password" required placeholder="Your password"><button class="button" type="submit">Log
                    in</button>
                <p class="form-message" aria-live="polite"></p>
            </form><a href="plans.html">New to Life360? Choose a plan</a>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
